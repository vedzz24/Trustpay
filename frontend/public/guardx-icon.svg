<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyan Neon Brand Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#15BCDF" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Base Rounded Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#15BCDF" stroke-width="3" stroke-opacity="0.35" />

  <!-- Subtle Cyber Grid Accent Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#15BCDF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#15BCDF" stroke-opacity="0.06" stroke-width="2" />

  <!-- Outer Ambient Glow behind shield -->
  <path d="M 256 90 L 372 142 V 262 C 372 334 322 398 256 422 C 190 398 140 334 140 262 V 142 Z"
        fill="#15BCDF" fill-opacity="0.2" filter="url(#softGlow)" />

  <!-- Outer Cyber Shield Rim -->
  <path d="M 256 94 L 370 146 V 262 C 370 332 320 394 256 418 C 192 394 142 332 142 262 V 146 Z"
        fill="url(#shieldInner)" stroke="url(#neonCyan)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Chamfered Shield Border -->
  <path d="M 256 122 L 344 162 V 254 C 344 310 306 360 256 380 C 206 360 168 310 168 254 V 162 Z"
        fill="#090d16" stroke="#15BCDF" stroke-width="4" stroke-opacity="0.6" stroke-linejoin="round" />

  <!-- The Iconic Stylized "X" & Security Checkmark -->
  <!-- Left Leg of X -->
  <path d="M 198 190 L 314 306" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" filter="url(#cyanGlow)" />
  <!-- Right Leg of X -->
  <path d="M 314 190 L 268 236" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" />
  <path d="M 238 266 L 198 306" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" />

  <!-- Floating Center Core Diamond / Shield Node -->
  <polygon points="256,228 278,250 256,272 234,250" fill="#ffffff" filter="url(#cyanGlow)" />
  <circle cx="256" cy="250" r="4" fill="#15BCDF" />

  <!-- GuardX Brand Name Typography at Bottom -->
  <text x="256" y="468" font-family="'Quantico', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#ffffff" text-anchor="middle">
    GUARD<tspan fill="#15BCDF">X</tspan>
  </text>
</svg>
